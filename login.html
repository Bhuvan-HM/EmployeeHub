
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Employee Management</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 36px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    h1 { margin: 0 0 8px; font-size: 25px; }
    .subtitle { margin: 0 0 28px; color: #64748b; line-height: 1.5; }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #dbeafe;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled { opacity: 0.65; cursor: wait; }
    #message { min-height: 20px; margin: 15px 0 0; font-size: 14px; color: #dc2626; }
    .footer { margin-top: 24px; color: #94a3b8; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">E</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to manage your employee records.</p>

    <form id="loginForm">
      <label for="username">Admin username</label>
      <input id="username" name="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <button id="loginButton" type="submit">Sign in</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>

    <div class="footer">Employee Management System</div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    fetch("/api/auth/me")
      .then(response => {
        if (response.ok) window.location.replace("/");
      })
      .catch(() => {});

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Signing in...";
      message.textContent = "";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const result = await response.json();

        if (!response.ok) {
          message.textContent = result.error || "Unable to sign in.";
          return;
        }

        window.location.replace("/");
      } catch {
        message.textContent = "Cannot connect to the server. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
